name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # NumPy from Day 3 on. PyTorch is installed so that Day 17's
      # comparison actually runs here: its tests skip cleanly without it,
      # which would leave a green badge standing for a check that never
      # executed.
      - run: pip install pytest numpy
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest
